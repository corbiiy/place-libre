name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the Pathé programme every 30 minutes (GitHub can start scheduled runs late).
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # If Pathé is unreachable this step fails and the last deployed site stays online.
      - name: Fetch the Pathé programme
        run: npm run sync:pathe
        env:
          TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
      - run: npm run lint
      - run: npm run build:pages
      - name: Check the exported page
        run: node --test tests/rendered-html.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
